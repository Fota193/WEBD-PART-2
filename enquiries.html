<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La'maison Reve - Enquiries</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #f5f5f5;
    }

    /* Navigation */
    nav {
      background: #000;
      border-bottom: 2px solid #d4af37;
      padding: 15px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: #f5f5f5;
      font-weight: bold;
      font-size: 1.1em;
      transition: all 0.3s ease;
    }

    nav ul li a:hover {
      color: #d4af37;
      text-shadow: 0 0 5px #d4af37;
    }

    /* Main content */
    main {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background: #1a1a1a;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
    }

    main h2 {
      text-align: center;
      color: #d4af37;
      font-size: 2em;
      margin-bottom: 20px;
    }

    main p {
      font-size: 1.2em;
      text-align: center;
      margin-bottom: 25px;
    }

    /* Form styling */
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      color: #d4af37;
    }

    input, textarea {
      padding: 10px;
      border: 1px solid #d4af37;
      border-radius: 5px;
      background: #222;
      color: #f5f5f5;
      font-size: 1em;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #ffcc00;
      box-shadow: 0 0 10px rgba(212,175,55,0.5);
    }

    button {
      background: #d4af37;
      color: #000;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ffcc00;
      transform: scale(1.05);
    }

    /* Client response section */
    h3 {
      text-align: center;
      color: #d4af37;
      margin-top: 40px;
    }

    img {
      display: block;
      margin: 20px auto;
      max-width: 100%;
      border: 3px solid #d4af37;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(212,175,55,0.4);
    }

    /* Footer */
    footer {
      background: #000;
      color: #d4af37;
      text-align: center;
      padding: 20px;
      border-top: 2px solid #d4af37;
      margin-top: 40px;
    }
  </style>
</head>

    <section>
      <h2>Enquiries</h2>
      <p>If you have any enquiry about La'maison Reve, please fill in the form below. Your dreams come first.</p>
      <form action="submit_enquiry.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Submit Enquiry</button>
      </form>

      <h3>Response from Luxury Clients</h3>
      <img src="_images/Fourth image.jpg" alt="Enquiries">
    </section>
  </main>
